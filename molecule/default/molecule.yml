---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: duplicati-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        duplicati_debug_service_enabled: false
        duplicati_restarts_check_enabled: true

        # The host directory mounted into the container through
        # `duplicati_container_additional_volumes_custom`, and the file placed in it by
        # prepare.yml. Reading that file from inside the container is what
        # proves the additional volumes reach the systemd unit rather than
        # being merely declared in defaults/main.yml.
        duplicati_molecule_extra_volume_src: /duplicati-molecule-extra
        duplicati_molecule_extra_volume_dst: /molecule-extra
        duplicati_molecule_extra_volume_marker: only-a-real-bind-mount-can-read-this

        # Files placed on the host under the paths the role bind-mounts. Jackett
        # itself is asked to list them back, so a mount that docker accepted but
        # the process cannot see does not pass.
        duplicati_molecule_marker_filename: duplicati-molecule-marker.txt

        # The file the scenario backs up and restores. Its content is asserted
        # byte for byte after the restore, so a backup that silently archives
        # nothing cannot pass.
        duplicati_molecule_canary_filename: canary.txt
        duplicati_molecule_canary_content: "duplicati-molecule-canary-8f3a1c\n"

        # The name of the job the scenario creates over the API, and the
        # subdirectory of `duplicati_backup_path` it writes its archives into.
        duplicati_molecule_job_name: molecule-canary

        # Variables for Duplicati
        #
        # Deliberately not 1000: the linuxserver.io PUID/PGID pattern has left a
        # needed directory unwritable in other roles of this fleet, and a uid
        # that exists in the test image by accident would hide that.
        duplicati_uid: 1717
        duplicati_gid: 1717

        # A dedicated directory, seeded by prepare.yml, rather than something
        # like /tmp: the scenario asserts that exactly this host path is what
        # ends up mounted at /source inside the container.
        duplicati_source_path: /duplicati-molecule-source

        duplicati_hostname: duplicati.molecule.local

        duplicati_path_prefix: /

        # Bound to the loopback interface of the test container only. Nothing
        # is published to the machine running Molecule, so two scenarios can
        # run side by side without fighting over a port.
        duplicati_container_http_host_bind_port: "127.0.0.1:8200"

        duplicati_container_http_port: 8200

        duplicati_container_additional_volumes_custom:
          - type: bind
            src: "{{ duplicati_molecule_extra_volume_src }}"
            dst: "{{ duplicati_molecule_extra_volume_dst }}"
            options: readonly

        duplicati_container_labels_traefik_enabled: true

        duplicati_container_labels_additional_labels:
          - mash.molecule.additional-label=set-by-the-role

        duplicati_container_extra_arguments:
          - "--label=mash.molecule.extra-argument=set-by-the-role"

        # Neither the role's default of Etc/UTC nor the test host's zone, so
        # that the timezone the container ends up in can only have come from
        # templates/env.j2.
        duplicati_environment_variables_tz: Asia/Tokyo

        duplicati_environment_variable_settings_encryption_key: moleculesettingskey1

        # Deliberately not `changeme`, which is what the container image falls
        # back to when DUPLICATI__WEBSERVICE_PASSWORD is unset. verify.yml
        # asserts that `changeme` is refused and that this value is accepted.
        duplicati_environment_variable_duplicati__webservice_password: molecule-webui-Pa55w0rd
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Idempotence is disabled because the role and the container disagree about
    # the permissions of `duplicati_config_path`. Duplicati chmods /config to
    # 0700 while it sets up its settings database, and the role's `file` task
    # sets it back to 0750 on the next run - `--diff` on that task shows exactly
    # `-mode: '0700'` / `+mode: '0750'` on /duplicati/config, and nothing else.
    # It settles after one run, but a Molecule idempotence check converges again
    # immediately, which is precisely when the drift is there.
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
