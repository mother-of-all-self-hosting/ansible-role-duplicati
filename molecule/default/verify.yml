---
- name: Verify Duplicati
  hosts: all
  become: true
  gather_facts: false

  vars:
    duplicati_molecule_api_url: "http://127.0.0.1:{{ duplicati_container_http_port }}"
    duplicati_molecule_canary_path: "{{ duplicati_source_path }}/{{ duplicati_molecule_canary_filename }}"
    duplicati_molecule_backup_target_path: "/duplicati/backup/{{ duplicati_molecule_job_name }}"

    # The unusual values the scenario configures the role with. Written down
    # here rather than read back out of the inventory, so that a verify run
    # compares the running container against something stated, not against
    # whatever the scenario happens to say at the time.
    duplicati_expected_uid: 1717
    duplicati_expected_gid: 1717
    duplicati_expected_hostname: duplicati.molecule.local
    duplicati_expected_timezone: Asia/Tokyo
    duplicati_expected_timezone_abbreviation: JST

    duplicati_verify_units:
      - duplicati.service

  tasks:
    - name: Verify that Duplicati works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: duplicati_defaults

        - name: Wait for the Duplicati systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: duplicati_services
          until: duplicati_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ duplicati_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Duplicati systemd services are active
          ansible.builtin.assert:
            that: duplicati_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(duplicati_verify_units | zip(duplicati_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Duplicati systemd services log for debugging
          when: duplicati_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ duplicati_verify_units }}"

        - name: Inspect the Duplicati container
          ansible.builtin.command:
            cmd: docker container inspect duplicati
          register: duplicati_container_raw
          changed_when: false

        - name: Inspect the Duplicati container
          ansible.builtin.set_fact:
            duplicati_container: "{{ (duplicati_container_raw.stdout | from_json)[0] }}"

        # ------------------------------------------------------------------
        # What the role told Docker to run
        # ------------------------------------------------------------------

        - name: Collect the mounts the role asked for
          ansible.builtin.set_fact:
            duplicati_container_mounts: >-
              {{
                dict(
                  duplicati_container.Mounts
                  | map(attribute='Destination') | list
                  | zip(duplicati_container.Mounts | map(attribute='Source') | list)
                )
              }}

        # A backup tool is only as good as what it can see and where it can write,
        # so the mount set is part of the role's contract. This also catches the
        # class of regression where an unrelated volume variable silently drops one
        # of the three binds out of the unit file.
        - name: Assert the Duplicati container binds the paths the role manages
          ansible.builtin.assert:
            that:
              - duplicati_container_mounts['/config'] | default('') == "/duplicati/config"
              - duplicati_container_mounts['/backup'] | default('') == "/duplicati/backup"
              - duplicati_container_mounts['/source'] | default('') == duplicati_source_path
            fail_msg: >-
              Duplicati container mounts are not the role's paths:
              {{ duplicati_container_mounts }}
              (expected /config=/duplicati/config, /backup=/duplicati/backup, /source={{ duplicati_source_path }})
            success_msg: "Duplicati container binds /config, /backup and /source to the role's paths"

        - name: Collect the extra mount the role asked for
          ansible.builtin.set_fact:
            duplicati_extra_mount: "{{ duplicati_container.Mounts | selectattr('Destination', 'equalto', duplicati_molecule_extra_volume_dst) | list }}"

        # Reading the file back from inside the
        # container is the difference between the variable existing and it working.
        - name: Read the marker through the additional volume
          ansible.builtin.command:
            cmd: >-
              docker exec duplicati
              cat {{ duplicati_molecule_extra_volume_dst }}/{{ duplicati_molecule_marker_filename }}
          register: duplicati_extra_volume
          changed_when: false

        - name: Assert the additional volume is mounted into the Duplicati container
          ansible.builtin.assert:
            that:
              - duplicati_extra_volume.rc == 0
              - duplicati_extra_volume.stdout | trim == duplicati_molecule_extra_volume_marker
            fail_msg: "The additional volume did not carry the marker into the container"
            success_msg: "The additional volume carries the marker into the container"

        # Unlike other services whose container image is provided by linuxserver.io,
        # Duplicati's container does not support running as non-root user. Values specified
        # with PUID and PGID are applied after the container is started.
        - name: Assert that the container itself runs as root
          ansible.builtin.assert:
            that:
              - duplicati_container.Config.User == '0:0'
            fail_msg: >-
              The container itself runs as root.
            success_msg: "The container runs as {{ duplicati_container.Config.User }}"

        # See the comment on the previous step.
        - name: Assert that the role's uid and gid reached the container
          ansible.builtin.assert:
            that:
              - ('PUID=' ~ duplicati_expected_uid) in duplicati_container.Config.Env
              - ('PGID=' ~ duplicati_expected_gid) in duplicati_container.Config.Env
            fail_msg: >-
              The container runs
              with {{ duplicati_container.Config.Env | select('match', 'P[UG]ID=') | list }}
            success_msg: "The container carries the matching PUID/PGID"

        - name: Assert that the role's timezone reached the container environment
          ansible.builtin.assert:
            that:
              - ('TZ=' ~ duplicati_expected_timezone) in duplicati_container.Config.Env
            fail_msg: "templates/env.j2 did not put TZ={{ duplicati_expected_timezone }} on the container"
            success_msg: "The container environment carries TZ={{ duplicati_expected_timezone }}"

        - name: Assert that the container image is the pinned version
          ansible.builtin.assert:
            that:
              - duplicati_container.Config.Image == 'ghcr.io/linuxserver/duplicati:' ~ duplicati_defaults.duplicati_version
            fail_msg: >-
              The container runs {{ duplicati_container.Config.Image }}, not the
              {{ duplicati_defaults.duplicati_version }} pinned in defaults/main.yml
            success_msg: "The container runs {{ duplicati_container.Config.Image }}"

        # ------------------------------------------------------------------
        # Traefik labels
        # ------------------------------------------------------------------

        - name: Assert that the Traefik labels describe the configured hostname
          ansible.builtin.assert:
            that:
              - duplicati_container.Config.Labels['traefik.enable'] == 'true'
              - duplicati_container.Config.Labels['traefik.http.services.duplicati.loadbalancer.server.port'] == '8200'
            fail_msg: "The Traefik labels are not what templates/labels.j2 should have produced: {{ duplicati_container.Config.Labels }}"
            success_msg: "The Traefik labels route {{ duplicati_expected_hostname }} to port 8200"

        - name: Assert that the additional labels and extra arguments reached the container
          ansible.builtin.assert:
            that:
              - duplicati_container.Config.Labels['mash.molecule.additional-label'] == 'set-by-the-role'
              - duplicati_container.Config.Labels['mash.molecule.extra-argument'] == 'set-by-the-role'
            fail_msg: >-
              duplicati_container_labels_additional_labels or
              duplicati_container_extra_arguments did not reach the container:
              {{ duplicati_container.Config.Labels }}
            success_msg: "The additional label and the extra argument both reached the container"

        # ------------------------------------------------------------------
        # What the process inside the container actually sees
        # ------------------------------------------------------------------

        - name: Ask the Duplicati container which timezone and user it is running in
          ansible.builtin.command:
            cmd: docker exec duplicati sh -c 'date +%Z; id -u; id -g'
          register: duplicati_process_identity
          changed_when: false

        # Unlike other services whose container image is provided by linuxserver.io,
        # Duplicati's container does not support running as non-root user.
        - name: Assert that the Duplicati process runs in the role's timezone, as the root user
          ansible.builtin.assert:
            that:
              - duplicati_process_identity.stdout_lines[0] == duplicati_expected_timezone_abbreviation
              - duplicati_process_identity.stdout_lines[1] == "0"
              - duplicati_process_identity.stdout_lines[2] == "0"
            fail_msg: >-
              The container reports zone/uid/gid {{ duplicati_process_identity.stdout_lines }},
              expected [{{ duplicati_expected_timezone_abbreviation }},
              0, 0]
            success_msg: >-
              The Duplicati process runs in {{ duplicati_process_identity.stdout_lines[0] }}
              as {{ duplicati_process_identity.stdout_lines[1] }}:{{ duplicati_process_identity.stdout_lines[2] }}

        # ------------------------------------------------------------------
        # The web service is up, and it is not open
        # ------------------------------------------------------------------

        # Duplicati refuses to start its web service at all without
        # SETTINGS_ENCRYPTION_KEY (the image logs "Missing encryption key, unable to
        # encrypt your settings database" and nothing ever listens on the port), so
        # an answer here is also evidence that env.j2's key reached the process.
        #
        # The API rather than `/` is what is waited on, because the port starts
        # accepting connections before the API pipeline is serving, and the
        # supervisor inside the image restarts the server once during first-boot
        # setup - a window in which `/` answers and the next request is reset. A
        # connection failure fails the module, which `until` treats as another
        # reason to retry, so the wait rides that out.
        - name: Wait for the Duplicati API to start serving (up to 10m)
          ansible.builtin.uri:
            url: "{{ duplicati_molecule_api_url }}/api/v1/systeminfo"
            method: GET
            status_code: [200, 401]
            follow_redirects: none
          register: duplicati_api_probe
          until: duplicati_api_probe.status | default(-1) in [200, 401]
          retries: 120
          delay: 5

        # Negative control: the UI is a single-page app that renders for anyone, so
        # only the API can say whether the instance is actually protected. A 200
        # here would mean the API answers system information to anyone who asks.
        - name: Assert the Duplicati API rejects unauthenticated requests
          ansible.builtin.assert:
            that: duplicati_api_probe.status == 401
            fail_msg: >-
              An unauthenticated request for system information was answered with
              {{ duplicati_api_probe.status }} instead of 401
            success_msg: "The Duplicati API rejects unauthenticated requests"

        - name: Wait for the Duplicati web UI to be served (up to 5m)
          ansible.builtin.uri:
            url: "{{ duplicati_molecule_api_url }}/"
            method: GET
            status_code: [200]
            follow_redirects: none
          register: duplicati_endpoint
          until: duplicati_endpoint.status | default(-1) == 200
          retries: 60
          delay: 5

        # Negative control: the container image falls back to `changeme` when
        # DUPLICATI__WEBSERVICE_PASSWORD is unset. If the role's password had not
        # reached the process, this would log in.
        - name: Assert the container image's fallback web UI password is refused
          ansible.builtin.uri:
            url: "{{ duplicati_molecule_api_url }}/api/v1/auth/login"
            method: POST
            body_format: json
            body:
              Password: changeme
            status_code: [401]
            follow_redirects: none
          register: duplicati_fallback_login
          until: duplicati_fallback_login.status | default(-1) == 401
          retries: 12
          delay: 5

        - name: Log in to the Duplicati API with the configured password
          ansible.builtin.uri:
            url: "{{ duplicati_molecule_api_url }}/api/v1/auth/login"
            method: POST
            body_format: json
            body:
              Password: "{{ duplicati_environment_variable_duplicati__webservice_password }}"
            status_code: [200]
          register: duplicati_login
          until: duplicati_login.status | default(-1) == 200
          retries: 12
          delay: 5

        - name: Read the Duplicati API access token
          ansible.builtin.set_fact:
            duplicati_molecule_api_headers:
              Authorization: "Bearer {{ duplicati_login.json.AccessToken }}"

        - name: Retrieve the Duplicati system information
          ansible.builtin.uri:
            url: "{{ duplicati_molecule_api_url }}/api/v1/systeminfo"
            method: GET
            headers: "{{ duplicati_molecule_api_headers }}"
            status_code: [200]
          register: duplicati_systeminfo

        # Duplicati reports four components (`2.3.0.4`) against a three-component
        # image tag (`2.3.0`), so the pinned value is matched as a prefix with a
        # trailing dot rather than compared for equality.
        - name: Assert the running Duplicati is the version this role installs
          ansible.builtin.assert:
            that:
              - duplicati_systeminfo.json.ServerVersion.startswith(duplicati_defaults.duplicati_version ~ '.')
              - duplicati_systeminfo.json.ServerVersionType == 'stable'
              - duplicati_container.Config.Labels['org.opencontainers.image.version'].startswith('v'~ duplicati_defaults.duplicati_version ~ '.') # Mind "v"
            fail_msg: "Duplicati reports {{ duplicati_systeminfo.json.ServerVersionName | default('none') }}, expected {{ duplicati_defaults.duplicati_version }}"
            success_msg: "Duplicati reports {{ duplicati_systeminfo.json.ServerVersionName }}"

        # ------------------------------------------------------------------
        # A backup actually backs up, and a restore actually restores
        # ------------------------------------------------------------------

        - name: Create a Duplicati backup job over the API
          ansible.builtin.uri:
            url: "{{ duplicati_molecule_api_url }}/api/v1/backups"
            method: POST
            headers: "{{ duplicati_molecule_api_headers }}"
            body_format: json
            body:
              Backup:
                Name: "{{ duplicati_molecule_job_name }}"
                Description: ""
                Tags: []
                TargetURL: "file:///backup/{{ duplicati_molecule_job_name }}"
                Settings:
                  - {Name: "encryption-module", Value: ""}
                  - {Name: "compression-module", Value: "zip"}
                  - {Name: "--no-encryption", Value: "true"}
                  - {Name: "passphrase", Value: ""}
                Filters: []
                Sources:
                  - /source/
              Schedule: null
            status_code: [200]
          register: duplicati_job_creation

        - name: Run the Duplicati backup job
          ansible.builtin.uri:
            url: "{{ duplicati_molecule_api_url }}/api/v1/backup/{{ duplicati_job_creation.json.ID }}/run"
            method: POST
            headers: "{{ duplicati_molecule_api_headers }}"
            status_code: [200]
          register: duplicati_backup_run

        - name: Wait for the Duplicati backup task to finish (up to 5m)
          ansible.builtin.uri:
            url: "{{ duplicati_molecule_api_url }}/api/v1/task/{{ duplicati_backup_run.json.ID }}"
            method: GET
            headers: "{{ duplicati_molecule_api_headers }}"
            status_code: [200]
          register: duplicati_backup_task
          until: duplicati_backup_task.json.TaskFinished is not none
          retries: 60
          delay: 5

        - name: Assert the Duplicati backup task succeeded
          ansible.builtin.assert:
            that:
              - duplicati_backup_task.json.Status == 'Completed'
              - duplicati_backup_task.json.ErrorMessage is none
            fail_msg: >-
              The backup task finished as `{{ duplicati_backup_task.json.Status }}`:
              {{ duplicati_backup_task.json.ErrorMessage | default('no error message') }}
            success_msg: "The backup task completed"

        # The job wrote to `file:///backup/...` inside the container. Finding its
        # archives at `duplicati_backup_path` on the host is what proves the
        # /backup bind is the role's directory and not a container-local one.
        - name: Find the archives the Duplicati backup produced on the host
          ansible.builtin.find:
            paths: "{{ duplicati_molecule_backup_target_path }}"
            patterns: "*.dlist.zip"
          register: duplicati_backup_archives

        - name: Assert the Duplicati backup landed in the role's backup path
          ansible.builtin.assert:
            that: duplicati_backup_archives.matched > 0
            fail_msg: >-
              No `*.dlist.zip` archive under {{ duplicati_molecule_backup_target_path }},
              so the backup did not reach the host path the role manages
            success_msg: >-
              The backup wrote {{ duplicati_backup_archives.matched }} archive(s)
              to {{ duplicati_molecule_backup_target_path }}

        - name: Overwrite the canary file so that a restore has something to prove
          ansible.builtin.copy:
            content: "clobbered before restore\n"
            dest: "{{ duplicati_molecule_canary_path }}"
            mode: "0640"
            owner: "{{ duplicati_uid }}"
            group: "{{ duplicati_gid }}"

        - name: Retrieve the Duplicati backup filesets
          ansible.builtin.uri:
            url: "{{ duplicati_molecule_api_url }}/api/v1/backup/{{ duplicati_job_creation.json.ID }}/filesets"
            method: GET
            headers: "{{ duplicati_molecule_api_headers }}"
            status_code: [200]
          register: duplicati_filesets

        - name: Assert the Duplicati backup produced a fileset
          ansible.builtin.assert:
            that: duplicati_filesets.json | length > 0
            fail_msg: "The backup job reports no filesets, so nothing was ever archived"
            success_msg: "The backup job reports {{ duplicati_filesets.json | length }} fileset(s)"

        - name: Restore the canary file from the Duplicati backup
          ansible.builtin.uri:
            url: "{{ duplicati_molecule_api_url }}/api/v1/backup/{{ duplicati_job_creation.json.ID }}/restore"
            method: POST
            headers: "{{ duplicati_molecule_api_headers }}"
            body_format: json
            body:
              paths:
                - "/source/{{ duplicati_molecule_canary_filename }}"
              time: "{{ duplicati_filesets.json[0].Time }}"
              overwrite: true
              permissions: false
              passphrase: ""
            status_code: [200]
          register: duplicati_restore_run

        - name: Wait for the Duplicati restore task to finish (up to 5m)
          ansible.builtin.uri:
            url: "{{ duplicati_molecule_api_url }}/api/v1/task/{{ duplicati_restore_run.json.ID }}"
            method: GET
            headers: "{{ duplicati_molecule_api_headers }}"
            status_code: [200]
          register: duplicati_restore_task
          until: duplicati_restore_task.json.TaskFinished is not none
          retries: 60
          delay: 5

        - name: Assert the Duplicati restore task succeeded
          ansible.builtin.assert:
            that:
              - duplicati_restore_task.json.Status == 'Completed'
              - duplicati_restore_task.json.ErrorMessage is none
            fail_msg: >-
              The restore task finished as `{{ duplicati_restore_task.json.Status }}`:
              {{ duplicati_restore_task.json.ErrorMessage | default('no error message') }}
            success_msg: "The restore task completed"

        - name: Read the restored canary file
          ansible.builtin.slurp:
            src: "{{ duplicati_molecule_canary_path }}"
          register: duplicati_restored_canary

        # The whole point of the role. A green suite without this assert would only
        # say that a backup program was started, not that it can back anything up.
        - name: Assert the restored canary file is byte-identical to the original
          ansible.builtin.assert:
            that: duplicati_restored_canary.content | b64decode == duplicati_molecule_canary_content
            fail_msg: >-
              The restored file reads
              `{{ duplicati_restored_canary.content | b64decode }}`
              instead of `{{ duplicati_molecule_canary_content }}`
            success_msg: "The canary file survived a backup and restore round trip byte for byte"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "duplicati_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: duplicati_restarts_before
              loop: "{{ duplicati_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: duplicati_restarts_after
              loop: "{{ duplicati_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - duplicati_restarts_after.results | map(attribute='status.NRestarts') | list == duplicati_restarts_before.results | map(attribute='status.NRestarts') | list
                  - duplicati_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in duplicati_verify_units | zip(duplicati_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in duplicati_verify_units | zip(duplicati_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in duplicati_verify_units | zip(duplicati_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Duplicati verification summary
          ansible.builtin.debug:
            msg:
              - "Duplicati systemd: {% for unit, state in duplicati_verify_units | zip(duplicati_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Duplicati restarts: {% for unit, restarts in duplicati_verify_units | zip(duplicati_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Duplicati version: {{ duplicati_systeminfo.json.ServerVersionName }} ({{ duplicati_systeminfo.json.ServerVersionType }})"
              - "Duplicati HTTP: {{ duplicati_endpoint.status }}"
              - "Duplicati image: {{ duplicati_container.Config.Image }}"
              - "Duplicati backup: {{ duplicati_backup_task.json.Status }}, {{ duplicati_backup_archives.matched }} archive(s)"
              - "Duplicati restore: {{ duplicati_restore_task.json.Status }}, canary intact"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Duplicati systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=duplicati.service
          register: duplicati_service_log
          changed_when: false

        - name: Show the Duplicati systemd service log
          ansible.builtin.debug:
            var: duplicati_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Duplicati verification failed. The systemd service log is printed above."
