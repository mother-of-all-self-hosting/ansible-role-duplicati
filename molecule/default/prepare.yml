---
- name: Prepare Duplicati Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for Duplicati Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for Duplicati Molecule tests preparation
      ansible.builtin.package:
        name:
          - python3-requests
        state: present

    - name: Ensure Docker is installed for Duplicati Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          storage-driver: vfs

    # The role does not create `duplicati_source_path` - it is the operator's
    # own data directory - so the scenario has to provide it, owned by the
    # container's user so that Duplicati can both read it for a backup and
    # write to it for a restore.
    - name: Ensure Duplicati Molecule source directory exists
      ansible.builtin.file:
        path: "{{ duplicati_source_path }}"
        state: directory
        mode: "0750"
        owner: "{{ duplicati_uid }}"
        group: "{{ duplicati_gid }}"

    - name: Ensure Duplicati Molecule canary file exists
      ansible.builtin.copy:
        content: "{{ duplicati_molecule_canary_content }}"
        dest: "{{ duplicati_source_path }}/{{ duplicati_molecule_canary_filename }}"
        mode: "0640"
        owner: "{{ duplicati_uid }}"
        group: "{{ duplicati_gid }}"
